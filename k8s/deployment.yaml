apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: download-model
          image: model-download:1
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: inference-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inference-secrets
                  key: HF_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
      containers:
        - name: vllm
          image: inference-cpu:0.27.0-3
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: inference-config
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-secrets
                  key: API_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: cache
              mountPath: /cache
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: config
          configMap:
            name: inference-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
